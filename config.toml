# All choices affecting samples, estimators, simulations and evaluation live here.
[paths]
raw = "data/raw"
output = "output"
reports = "reports"
reference = "reference"

[data]
categories = ["sdr", "cer", "lnd"]
chunk_rows = 250000
first_week = 1
last_week = 399
training_share = 0.70
validation_share = 0.15
products = 4
minimum_coverage = 0.50
minimum_training_weeks = 60
minimum_stores = 15
# Broad market includes private-label, cherry, caffeine-free, clear and Diet Rite colas.
cola_pattern = "COKE|COCA|PEPSI|COLA"
ambiguous_pattern = "COLA CHAMPAGNE|COKE PRODUCTS"
brand_pattern = "COKE|COCA|PEPSI|COLA"
# Core selection excludes variants whose attributes differ from plain caffeinated cola.
variant_pattern = "CHERRY|CAFFEINE|CRYSTAL|COKE II|BRAND COKE"
size_pattern = '^2 *L(T|TR|ITER)?$'
omitted_minimum_coverage = 0.20
category_coverage_threshold = 0.90

[demand]
specifications = ["week_FE", "season_trend", "season_only"]
dynamic_lags = 4
cluster = "store_and_week"

[pricing]
price_changes = [0.05, 0.10, 0.15]
cost_multipliers = [0.90, 1.00, 1.10]
grid_points = 21
maximum_iterations = 100
support_quantiles = [0.05, 0.95]
minimum_reference_stores = 15
draws = 400
seed = 8102026
robust_grid_points = 11
robust_maximum_change = 0.10
lower_tail = 0.05

[forecast]
rolling_window = 156
calibration_window = 26
calibration_warmup = 52
minimum_calibration_weeks = 8
calibration_shrinkage_weeks = 8
factor_bounds = [0.50, 2.00]
models = ["seasonal_naive", "recent4", "calendar", "pricing", "no_trend", "rolling_no_trend", "rolling_calibrated", "rolling_promo_calibrated"]

[verification]
absolute_tolerance = 0.000001
relative_tolerance = 0.00000001
absorption_tolerance = 0.00000000001
price_tolerance = 0.00000001
profit_tolerance = 0.000001
